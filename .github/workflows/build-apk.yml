name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: ${JAVA_VER_LINE}"
          MAJOR_VER=$(echo "${JAVA_VER_LINE}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "${MAJOR_VER}" ] || ! echo "${MAJOR_VER}" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: Active Java version could not be detected."
            exit 1
          fi
          echo "Detected active Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Active Java major version (${MAJOR_VER}) is lower than 17."
            exit 1
          fi
          echo "Confirmed Java ${MAJOR_VER} (>= 17) is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is not a regular file."
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is empty."
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: ${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac
          echo "Verified exact debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_TMP_DIR}/app-debug.apk"
          if [ ! -s "${RELEASE_TMP_DIR}/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare app-debug.apk in temporary directory."
            exit 1
          fi
          echo "apk_path=${RELEASE_TMP_DIR}/app-debug.apk" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version
          APK_ASSET="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -f "${APK_ASSET}" ] || [ ! -s "${APK_ASSET}" ]; then
            echo "ERROR: Prepared APK does not exist or is empty."
            exit 1
          fi
          ASSET_BASENAME=$(basename "${APK_ASSET}")
          case "${ASSET_BASENAME}" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not end in .apk."
              exit 1
              ;;
          esac
          if [ "${ASSET_BASENAME}" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK built by GitHub Actions (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT}, Commit ${GITHUB_SHA}). Intended for testing only; not a Play Store production release; signed only with a temporary debug keystore."

          gh release create "${RELEASE_TAG}" "${APK_ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url -q .url)
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup Artifact: Actions artifact app-debug-apk remains available as a backup."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build succeeded and the Actions artifact named app-debug-apk remains available."
            fi
          fi

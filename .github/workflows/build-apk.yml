name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: ${JAVA_VER_LINE}"
          MAJOR_VER=$(echo "${JAVA_VER_LINE}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "${MAJOR_VER}" ] || ! echo "${MAJOR_VER}" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: Active Java version could not be detected."
            exit 1
          fi
          echo "Detected active Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Active Java major version (${MAJOR_VER}) is lower than 17."
            exit 1
          fi
          echo "Confirmed Java ${MAJOR_VER} (>= 17) is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build User App & Admin Panel APKs
        run: gradle :app:assembleDebug :admin-app:assembleDebug --stacktrace --no-daemon

      - name: Verify User and Admin APKs
        run: |
          EXPECTED_USER_APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_ADMIN_APK="admin-app/build/outputs/apk/debug/admin-app-debug.apk"

          if [ ! -f "${EXPECTED_USER_APK}" ] || [ ! -s "${EXPECTED_USER_APK}" ]; then
            echo "ERROR: User APK not found or empty at ${EXPECTED_USER_APK}."
            exit 1
          fi
          if [ ! -f "${EXPECTED_ADMIN_APK}" ] || [ ! -s "${EXPECTED_ADMIN_APK}" ]; then
            echo "ERROR: Admin APK not found or empty at ${EXPECTED_ADMIN_APK}."
            exit 1
          fi

          cp "${EXPECTED_ADMIN_APK}" "admin-app/build/outputs/apk/debug/admin-debug.apk"
          echo "Verified User APK: ${EXPECTED_USER_APK}"
          echo "Verified Admin APK: admin-app/build/outputs/apk/debug/admin-debug.apk"

      - name: Upload User App APK artifact (app-debug-apk)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Admin Panel APK artifact (admin-debug-apk)
        uses: actions/upload-artifact@v4
        with:
          name: admin-debug-apk
          path: admin-app/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          RELEASE_TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_TMP_DIR}/app-debug.apk"
          cp "admin-app/build/outputs/apk/debug/admin-debug.apk" "${RELEASE_TMP_DIR}/admin-debug.apk"
          if [ ! -s "${RELEASE_TMP_DIR}/app-debug.apk" ] || [ ! -s "${RELEASE_TMP_DIR}/admin-debug.apk" ]; then
            echo "ERROR: Failed to prepare app-debug.apk and admin-debug.apk in temporary directory."
            exit 1
          fi
          echo "user_apk_path=${RELEASE_TMP_DIR}/app-debug.apk" >> "${GITHUB_OUTPUT}"
          echo "admin_apk_path=${RELEASE_TMP_DIR}/admin-debug.apk" >> "${GITHUB_OUTPUT}"

      - name: Publish APKs to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version
          USER_APK_ASSET="${{ steps.prepare_asset.outputs.user_apk_path }}"
          ADMIN_APK_ASSET="${{ steps.prepare_asset.outputs.admin_apk_path }}"

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="APK Build #${GITHUB_RUN_NUMBER} (User App + Admin Panel App)"
          RELEASE_NOTES="Automatically generated User App APK (app-debug.apk) and Admin Panel APK (admin-debug.apk) built by GitHub Actions (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT}, Commit ${GITHUB_SHA})."

          gh release create "${RELEASE_TAG}" "${USER_APK_ASSET}" "${ADMIN_APK_ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          USER_DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          ADMIN_DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/admin-debug.apk"
          echo "USER APK DIRECT DOWNLOAD: ${USER_DIRECT_URL}"
          echo "ADMIN APK DIRECT DOWNLOAD: ${ADMIN_DIRECT_URL}"
          {
            echo "### 📱 DIRECT APK DOWNLOAD LINKS"
            echo "- **১. ইউজার অ্যাপ (User App APK):** ${USER_DIRECT_URL}"
            echo "- **২. অ্যাডমিন প্যানেল অ্যাপ (Admin Panel APK):** ${ADMIN_DIRECT_URL}"
            echo ""
            echo "*(এছাড়া নিচে Artifacts সেকশনে \`app-debug-apk\` এবং \`admin-debug-apk\` দুইটি আলাদা ফাইল হিসেবেও ডাউনলোডের জন্য রেডি আছে)*"
          } >> "${GITHUB_STEP_SUMMARY}"
